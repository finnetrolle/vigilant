# Fixed synthetic policy snapshot for adversarial resource qualification.
# A long per-fragment deadline keeps the expected CLEAN outcome independent
# from host speed while preserving the production detector and ALLOW reaction.
policies = [
  {
    id = "qualification-request-pii"
    version = "1"
    enabled = true
    match {
      url = "*"
      model = "*"
      phase = "REQUEST"
      subject { type = "*", id = "*" }
    }
    detectors = ["fast-pii"]
    deadline = 30s
    reactions {
      detected { disposition = "ALLOW", transformations = [] }
      clean { disposition = "ALLOW", transformations = [] }
      error { disposition = "ALLOW", transformations = [] }
    }
    overrides = []
  }
]
