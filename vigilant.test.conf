# Конфигурация для тестовых запусков.
# Запуск: VIGILANT_CONFIG=./vigilant.test.conf VIGILANT_POLITICS_CONFIG=./politics.conf.example ./build/install/vigilant/bin/vigilant
# Отдельное имя (не vigilant.conf) - чтобы файл не подхватывался автоматически
# при поиске по умолчанию (./vigilant.conf).
vigilant {
  upstream-url = "http://127.0.0.1:1234"
  port = 9009
}
