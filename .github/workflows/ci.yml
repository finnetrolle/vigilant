name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests, detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build (compiler warnings-as-errors, tests, detekt)
        run: ./gradlew build
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/tests/
            build/reports/detekt/

  pitest:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Run mutation tests
        run: ./gradlew pitest
      - name: Upload mutation report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest/

  dependency-check:
    name: OWASP CVE scan
    runs-on: ubuntu-latest
    # Skipped silently when the repository has no NVD_API_KEY secret configured.
    if: ${{ github.secret_source == 'Actions' && secrets.NVD_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check/data
          key: nvd-db-${{ github.run_id }}
          restore-keys: nvd-db-
      - name: Run dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze
      - name: Upload CVE report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
